services:

  medit-back:
    container_name: medit_back
    build:
      context: .
      dockerfile: Dockerfile
    image: medit_back
    restart: always
    command: ["sh", "entrypoint.sh"]
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      medit-db:
        condition: service_started
      medit-redis:
        condition: service_started
    ports:
      - 8778:5000
    networks:
      - medit-net
#    profiles: ["tool", "develop"]

  medit-db:
    image: postgres:12.0-alpine
    container_name: medit_postgresql
    volumes:
#      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=medit_admin
      - POSTGRES_PASSWORD=medit_admin_pass
      - POSTGRES_DB=medit_dev
    ports:
      - 5432:5432
    networks:
      - medit-net
    restart: on-failure
#    profiles: ["develop"]

  medit-celery:
    image: medit_back
    container_name: medit_celery
    volumes:
      - .:/app
    depends_on:
      medit-redis:
        condition: service_started
      medit-back:
        condition: service_started
    env_file: .env
    restart: always
    command: celery -A ai_medit.celery worker --loglevel=info
    networks:
      - medit-net

  medit-redis:
    image: redis:5
    container_name: medit_redis
    networks:
      - medit-net
#    profiles: ["tool", "develop"]


volumes:
  postgres_data:

networks:
  medit-net:
    name: medit-net